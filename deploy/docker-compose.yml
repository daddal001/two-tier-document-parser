version: '3.8'

services:
  # Fast Parser - CPU-based using PyMuPDF4LLM
  # For high-volume, simple text extraction
  fast-parser:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fast
    container_name: fast-parser
    ports:
      - "8004:8004"
    environment:
      - WORKERS=4             # Number of parser worker processes
      - LOG_LEVEL=INFO        # Logging level, any case (DEBUG, INFO, WARNING, ERROR)
    read_only: true           # The image runs unprivileged and needs no writable root
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Linux containers cannot use macOS MPS. Use the CUDA profile on an NVIDIA
  # host; run the accurate service natively on Apple Silicon for MPS support.
  accurate-parser-cuda:
    profiles: [cuda]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.accurate
    container_name: accurate-parser
    ports:
      - "8005:8005"
    volumes:
      # Persist MinerU model bundles across container rebuilds
      - mineru-models:/root/.mineru
    environment:
      WORKERS: "2"
      LOG_LEVEL: INFO
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      UVICORN_TIMEOUT_KEEP_ALIVE: "600"
      TOKENIZERS_PARALLELISM: "false"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 16G
        reservations:
          cpus: '1'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  accurate-parser-cpu:
    profiles: [cpu]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.accurate.cpu
    ports:
      - "8005:8005"
    volumes:
      - cpu-models:/models
    environment:
      WORKERS: "2"
      LOG_LEVEL: INFO
      MINERU_DEVICE_MODE: cpu
      MINERU_MODEL_SMALL_BACKEND: onnx
      MINERU_DOWNLOAD_MODELS: pipeline
      MINERU_MODEL_SOURCE: huggingface
      MINERU_MODEL_BASE_DIR: /models
      HF_HOME: /models/huggingface
      UVICORN_TIMEOUT_KEEP_ALIVE: "600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # first start downloads the models
    restart: unless-stopped

networks:
  default:
    name: document-parser-network

volumes:
  mineru-models:
  cpu-models:
