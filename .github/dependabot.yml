version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The package supports Python 3.11 and 3.12 (requires-python); a newer base image
      # cannot install it. Patch updates of the supported minor still arrive.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The GPU base image is chosen to match the pinned MinerU release, and it can only be
      # validated on a GPU host. Move it by hand together with the MinerU pin.
      - dependency-name: vllm/vllm-openai
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
