version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The services run on Python 3.14 and the package supports 3.12 to 3.14 (requires-python);
      # 3.15 cannot install yet (onnxruntime and pyyaml have no 3.15 wheels). Patch updates of
      # the supported minor still arrive.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The CUDA base image is vLLM's, and it can only be validated on a GPU host. A newer
      # release can break MinerU's vision-language model (0.34.0 removed a module that
      # mineru-vl-utils imports), so it moves by hand, with a T4 run and recompiled pins
      # (scripts/compile_gpu_constraints.py), together with the MinerU pin.
      - dependency-name: vllm/vllm-openai
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
