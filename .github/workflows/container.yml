name: Container

# Builds the fast image and runs it the way a locked-down pod does: unprivileged, read-only
# root, no capabilities. It runs only when something that reaches the image changes, so the
# main CI stays quick.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/Dockerfile.fast'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/container/**'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'deploy/Dockerfile.fast'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/container/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra fast --extra dev
      - name: Run the container tests
        run: uv run --frozen --no-sync pytest tests/container -m container -v -p no:cacheprovider
