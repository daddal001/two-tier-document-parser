name: Security

# Scans that need the network, so they run weekly and when something that feeds the dependencies
# or the code changes rather than on every push. Each job reports in its own run; none is a
# required check, so a newly published advisory never blocks an unrelated change. The Trivy and
# OSV scans of the images and the pinned files are not run here: they are tests (tests/security)
# that run with the rest of the suite.
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'deploy/**'
      - 'src/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'deploy/**'
      - 'src/**'
      - '.github/workflows/security.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    # Known vulnerabilities in what the lock file and the accurate image's pins would install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras -o "$RUNNER_TEMP/locked.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/locked.txt"
      - name: Audit the accurate CPU image's pinned set
        # a finding in the lock file must not hide the findings in this separate set
        if: ${{ !cancelled() }}
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r deploy/constraints/accurate-cpu.txt
      - name: Audit the accurate GPU image's pinned Python set
        # The setuptools advisories are accepted on purpose (vLLM requires setuptools<81); the
        # reason and the expiry date are in osv-scanner.toml, which pip-audit does not read.
        if: ${{ !cancelled() }}
        run: >
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps
          --ignore-vuln GHSA-h35f-9h28-mq5c --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-xmj3-9gf7-h52w
          -r deploy/constraints/accurate-gpu.txt

  code:
    # Static analysis of the service code, the Dockerfiles, the workflows and any committed secret.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Run Semgrep
        run: >
          uvx --from semgrep==1.183.0 semgrep scan --error --metrics=off
          --config p/python --config p/fastapi --config p/dockerfile
          --config p/github-actions --config p/secrets
          src deploy .github scripts
